[project]
name = "strixrun"
version = "0.1.7"
description = "API-first local LLM server for llama.cpp models, with a light web dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "huggingface_hub>=0.30",
    "psutil>=6.0",
    "typer>=0.15",
]

[project.scripts]
strixrun = "strixrun.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "openai>=1.60",
    "ruff>=0.8",
    "gguf>=0.10",  # test fixtures only; StrixRun parses GGUF headers itself
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strixrun"]
# web_dist is git-ignored (a build output), so it must be declared to be packaged.
artifacts = ["src/strixrun/web_dist/**"]

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "src/strixrun/web_dist"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: real-model end-to-end tests (opt-in: -m e2e)",
    "network: tests that hit the network",
]
addopts = "-m 'not e2e and not network'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Nested async-with blocks read more clearly in tests; test helpers spawn processes on purpose.
"tests/**" = ["SIM117", "ASYNC220"]
